services:
  postgres:
    build:
      context: .
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netmo}
      POSTGRES_USER: ${POSTGRES_USER:-netmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD antes de iniciar Docker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-netmo}
      POSTGRES_USER: ${POSTGRES_USER:-netmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD antes de iniciar Docker}
      BACKUP_DIR: /backups
      BACKUP_DATABASE: ${BACKUP_DATABASE:-${POSTGRES_DB:-netmo}}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_ONCE: ${BACKUP_ONCE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-netmo}
      POSTGRES_USER: ${POSTGRES_USER:-netmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD antes de iniciar Docker}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

